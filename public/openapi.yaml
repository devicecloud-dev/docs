  /device/sessions/{id}/request-human:
    parameters:
      - name: id
        in: path
        required: true
        description: The session id, such as `brave-teal-otter`. The numeric `live_id` works too.
        schema:
          type: string
        example: brave-teal-otter
    post:
      tags: [Human handoff]
      operationId: requestHuman
      summary: Ask a person for help
      description: >-
        Asks a person to do something on the device, such as entering a 2FA code. The session moves to
        `needs_human` and its idle timer pauses, for up to your organization's limit (30 minutes by default),
        and never past the session's maximum duration. When the session starts waiting, your organization's
        webhook gets a `device.needs_human` event. Asking again while it waits updates the reason. Poll GET
        /device/sessions/{id}/human until `handed_back` is true. Allowed while a person has control.
      parameters:
        - name: x-dcd-source
          in: header
          required: false
          description: >-
            Which interface sent the request: `cli`, `mcp`, `web` or `api`, in any case. It is recorded on the
            timeline entry. Any other value, or none, counts as `api`. It is a label, not a credential.
          schema:
            type: string
            enum: [cli, mcp, web, api]
            default: api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestHumanRequest'
            example:
              reason: Enter the 2FA code sent to the test phone, then hand back
      responses:
        '201':
          description: The session is waiting for a person.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HumanResponse'
              example:
                session:
                  id: brave-teal-otter
                  live_id: 4182
                  state: needs_human
                  release_reason: null
                  platform: android
                  model: pixel-10-api-36
                  client_label: claude-code
                  created_at: '2026-11-10T14:00:00.000Z'
                  started_at: '2026-11-10T14:00:21.000Z'
                  released_at: null
                  expires_at: '2026-11-10T15:00:21.000Z'
                  queue: null
                  time_remaining_s: 2901
                  idle_remaining_s: null
                  cost_so_far_usd: 0.36
                  last_crash: null
                  install:
                    binary_upload_id: 8a2d4c6e-1f3b-4d5a-8e7c-9b0a1c2d3e4f
                    status: installed
                    error: null
                  warnings:
                    - 'Waiting for a human: Enter the 2FA code sent to the test phone, then hand back. The session ends in 1800s unless they hand it back. Poll get_human_status (MCP) or run `dcd device human --wait`; the idle timer is paused meanwhile.'
                  monitor_url: https://console.devicecloud.dev/device/brave-teal-otter
                human:
                  waiting: true
                  reason: Enter the 2FA code sent to the test phone, then hand back

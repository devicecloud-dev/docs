    post:
      tags: [Device control]
      operationId: runFlow
      summary: Run a Maestro flow
      description: >-
        Runs Maestro on the device: `yaml` for one flow, or `flowUploadId` for a flow bundle (`flow` names
        the entry file; without it, every flow in the bundle runs). `env` passes secrets and variables. The
        request waits for the flow up to 110 s, or `waitSeconds`. A flow that takes longer answers `running`
        with a `command_id`: follow it with GET /device/sessions/{id}/commands/{commandId}. A failed run
        answers 201 with `status` `failed`; its result says where it failed and lists the app's visible text
        just after.
      parameters:
        - name: x-dcd-source
          in: header
          required: false
          description: >-
            Which interface sent the request: `cli`, `mcp`, `web` or `api`, in any case. It is recorded as the
            command's `source` on the timeline. Any other value, or none, counts as `api`. It is a label, not a
            credential.
          schema:
            type: string
            enum: [cli, mcp, web, api]
            default: api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RunRequest'
            examples:
              inline:
                summary: One flow, inline, with a secret
                value:
                  yaml: "appId: com.example.app\n---\n- tapOn: \"Email\"\n- inputText: \"qa@example.com\"\n- tapOn: \"Password\"\n- inputText: ${PASSWORD}\n- tapOn: \"Log in\"\n- assertVisible: \"Welcome\""
                  env:
                    PASSWORD: correct-horse-battery
              bundle:
                summary: One flow from a bundle, waiting longer
                value:
                  flowUploadId: 0b6f2d1e-8a3c-4f5b-9e7d-1c2a3b4c5d6e

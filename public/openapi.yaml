  /device/sessions/{id}/actions:
    parameters:
      - name: id
        in: path
        required: true
        description: The session id, such as `brave-teal-otter`. The numeric `live_id` works too.
        schema:
          type: string
        example: brave-teal-otter
    post:
      tags: [Device control]
      operationId: performAction
      summary: Perform one action
      description: >-
        Sends one action to the device: `tap`, `type`, `swipe` or `press_key`. The device performs it
        directly and the request answers once the screen has settled, usually well under a second (up to
        120 s, after waiting up to 45 s for a device that is still starting or installing). `mode: "maestro"`
        runs the action as a one-command Maestro flow instead. A `tap` on something that is not on screen
        waits about 17 s before it fails, so `inspect` first. An action that fails on the device still answers
        201, with `result.success` false. A `type` action with `sensitive: true` sends its text as a secret: it
        never appears in the timeline and is masked in `inspect`.
      parameters:
        - name: x-dcd-source
          in: header
          required: false
          description: >-
            Which interface sent the request: `cli`, `mcp`, `web` or `api`, in any case. It is recorded as the
            command's `source` on the timeline. Any other value, or none, counts as `api`. It is a label, not a
            credential.
          schema:
            type: string
            enum: [cli, mcp, web, api]
            default: api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceAction'
            examples:
              tapText:
                summary: Tap an element by its text
                value:
                  type: tap
                  text: Log in
              tapPoint:
                summary: Tap a point, in percent of the screen
                value:
                  type: tap
                  x: 50
                  y: 82
              typeSecret:
                summary: Type a password without recording it
                value:
                  type: type
                  text: correct-horse-battery
                  sensitive: true
              swipe:
                summary: Swipe up

                  value:
                    statusCode: 409
                    message: Device session "brave-teal-otter" has ended (idle_timeout). Start a new one.
                    error: LIVE_SESSION_ENDED
                    session:
                      id: brave-teal-otter
                      live_id: 4182
                      state: expired
                      release_reason: idle_timeout
                      platform: android
                      model: pixel-10-api-36
                      client_label: claude-code
                      created_at: '2026-11-10T14:00:00.000Z'
                      started_at: '2026-11-10T14:00:21.000Z'
                      released_at: '2026-11-10T14:31:02.000Z'
                      expires_at: null
                      queue: null
                      time_remaining_s: null
                      idle_remaining_s: null
                      cost_so_far_usd: 0.93
                      last_crash: null
                      install:
                        binary_upload_id: 8a2d4c6e-1f3b-4d5a-8e7c-9b0a1c2d3e4f
                        status: installed
                        error: null
                      warnings: []
                      monitor_url: https://console.devicecloud.dev/device/brave-teal-otter
        '429':
          $ref: '#/components/responses/LiveRateLimited'

  /device/bundles/upload-url:
    post:
      tags: [Flow bundles]
      operationId: createBundleUploadUrl
      summary: Get URLs to upload a flow bundle to
      description: >-
        Returns a new bundle id and signed URLs to `PUT` the zip to: `upload` and `mirror`. Either may be
        null. Upload to each one given, then register the bundle with POST /device/bundles.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BundleUploadUrlRequest'
            example:
              bytes: 18342
      responses:
        '201':
          description: The bundle id and where to upload it.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BundleUploadUrls'
              example:
                id: 0b6f2d1e-8a3c-4f5b-9e7d-1c2a3b4c5d6e
                upload:
                  path: 7/device-bundles/0b6f2d1e-8a3c-4f5b-9e7d-1c2a3b4c5d6e.zip
                  signedUrl: https://xyzcompany.supabase.co/storage/v1/object/upload/sign/organizations/7/device-bundles/0b6f2d1e-8a3c-4f5b-9e7d-1c2a3b4c5d6e.zip?token=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJ1cmwiOiJvcmdhbml6YXRpb25zLzcifQ.sig
                mirror:
                  path: organizations/7/device-bundles/0b6f2d1e-8a3c-4f5b-9e7d-1c2a3b4c5d6e.zip
                  signedUrl: https://s3.us-west-004.backblazeb2.com/example-bucket/organizations/7/device-bundles/0b6f2d1e-8a3c-4f5b-9e7d-1c2a3b4c5d6e.zip?X-Amz-Algorithm=AWS4-HMAC-SHA256&X-Amz-Expires=3600&X-Amz-Signature=3b1f
        '400':
          description: '`LIVE_INVALID_ACTION`: `bytes` isn''t a whole number from 1 to 50 MB.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveError'
              example:
                statusCode: 400
                message: bytes is the zip's size, at most 50 MB.
                error: LIVE_INVALID_ACTION
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/LiveRateLimited'
        '503':
          description: Neither upload URL could be signed. No `error` code. Retry.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveError'
              example:
                statusCode: 503
                message: Could not prepare the bundle upload. Please retry.

  /device/bundles:
    post:
      tags: [Flow bundles]
      operationId: registerBundle
      summary: Register an uploaded flow bundle
      description: >-
        Records a bundle you uploaded, after checking that the zip is in storage. Say which URLs you uploaded
        to with `supabase` and `backblaze`. Registering the same bundle again returns it unchanged, so it is
        safe to retry. Pass its `id` to `run` as `flowUploadId`. Bundles are deleted a day after upload, once
        no command needs them.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterBundleRequest'
            example:
              id: 0b6f2d1e-8a3c-4f5b-9e7d-1c2a3b4c5d6e
              sha: 9f2c4a1b7e3d5f6a8b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a
              bytes: 18342
              supabase: true
              backblaze: true
      responses:
        '201':
          description: The registered bundle.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BundleResponse'
              example:
                bundle:
                  id: 0b6f2d1e-8a3c-4f5b-9e7d-1c2a3b4c5d6e
                  sha: 9f2c4a1b7e3d5f6a8b0c1d2e3f4a5b6c7d8e9f0a1b2c3d4e5f6a7b8c9d0e1f2a
                  bytes: 18342
                  encrypted: false
                  created_at: '2026-11-10T14:05:12.881Z'
        '400':
          description: >-
            `LIVE_INVALID_ACTION`: `id`, `sha`, `bytes` or `enc` is malformed, or the zip isn't in storage at the
            places named.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveError'
              examples:
                notUploaded:
                  summary: The zip isn't in storage
                  value:
                    statusCode: 400
                    message: The bundle was not found in storage. Upload the zip to the URLs from upload-url first, then register it.
                    error: LIVE_INVALID_ACTION
                badSha:
                  summary: A malformed hash
                  value:
                    statusCode: 400
                    message: sha is the SHA-256 of the uploaded zip, in hex.
                    error: LIVE_INVALID_ACTION
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/LiveRateLimited'
  /ip-addresses:
    get:
      operationId: getIpAddresses
      tags: [IP addresses]
      summary: Get IP addresses
      description: |
        The test runners' egress IP addresses, so firewall automation can keep an
        allow-list in sync. No API key needed, and not rate limited. Responses
        are cacheable for an hour: polling hourly is plenty. Watch `updatedAt` to
        notice a change.
      security: []
      responses:
        '200':
          description: The current addresses.
          headers:
            Cache-Control:
              description: '`public, max-age=3600`'
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IpAddresses'
components:
  securitySchemes:
    apiKey:
      type: apiKey
      in: header
      name: x-app-api-key
      description: An API key from **Settings → API Keys** in the console.
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A DeviceCloud login session's access token, as `dcd login` uses. Send it
        with `x-dcd-org`.
    orgHeader:
      type: apiKey
      in: header
      name: x-dcd-org
      description: |
        The team (organization) ID to act as, with a Bearer token. The signed-in
        user must be a member of that team.
  parameters:
    UploadId:
      name: uploadId
      in: path
      required: true
      description: The upload's ID.
      schema:
        type: string
        format: uuid
      example: 7e12345f-eb12-12ec-a30b-bb1234f1d12a
    IfNoneMatch:
      name: If-None-Match
      in: header
      description: The `ETag` of a previous response. Answers `304` if nothing has changed.
      schema:
        type: string
      example: W/"115-QMD/XiKlxwtOKM/qnGnVrtcbhVo"
    PlatformFilter:
      name: platform
      in: query
      description: Only runs on this platform.
      schema:
        $ref: '#/components/schemas/Platform'
    AppIdFilter:
      name: appId
      in: query
      description: Only runs of this app (bundle ID or package name).
      schema:
        type: string
      example: com.example.app
  headers:
    ETag:
      description: A weak validator for the response body. Send it back in `If-None-Match`.
      schema:
        type: string
      example: W/"115-QMD/XiKlxwtOKM/qnGnVrtcbhVo"
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
  responses:
    Forbidden:
      description: |
        No credentials, an invalid or expired API key, a Bearer token without a
        valid `x-dcd-org`, or a key whose scope doesn't reach this endpoint
        (`"error": "API_KEY_SCOPE"`).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          examples:
            invalidKey:
              summary: Invalid API key
              value:
                statusCode: 403
                message: Invalid API key. Please check your API key and ensure it is valid for this environment.
                error: Forbidden
            scope:
              summary: Key scope too narrow
              value:
                statusCode: 403
                message: This API key is limited to device_sessions and can't reach /uploads/list. Use a key with full access for this.
                error: API_KEY_SCOPE
    RateLimited:
      description: Over 60 requests a minute. Wait for `Retry-After` seconds.
      headers:
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            statusCode: 429
            message: 'ThrottlerException: Too Many Requests'
    KeyCheckUnavailable:
      description: |
        The API key couldn't be checked because of a temporary problem on
        DeviceCloud's side. This says nothing about whether the key is valid. Retry.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            statusCode: 503
            message: Could not validate the API key right now (a temporary problem on our side). Please retry.
            error: Service Unavailable
    InvalidUploadId:
      description: '`uploadId` isn''t a UUID.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            statusCode: 400
            message: Validation failed (uuid is expected)
            error: Bad Request
    NotModified:
      description: Nothing has changed since the response whose `ETag` you sent. No body.
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
    NoResults:
      description: The upload has no results in your organization, or doesn't exist.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageOnlyError'
          example:
            message: No results found for this upload
    MessageOnlyServerError:
      description: The report couldn't be built.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/MessageOnlyError'
          example:
            message: Failed to merge JUNIT reports
    ServerError:
      description: A problem on DeviceCloud's side.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorEnvelope'
          example:
            statusCode: 500
            message: Internal server error
    LiveNotFound:
      description: '`LIVE_NOT_FOUND`: no session with this id in your organization.'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LiveError'
          example:
            statusCode: 404
            message: No device session "brave-teal-otter" in your organization.
            error: LIVE_NOT_FOUND
    LiveSessionEnded:
      description: >-
        `LIVE_SESSION_ENDED`: the session has ended. The body includes its `session` block, with why it ended.
        Start a new session.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LiveError'
          examples:
            sessionEnded:
              summary: The session has ended
              value:
                statusCode: 409
                message: Device session "brave-teal-otter" has ended (idle_timeout). Start a new one.
                error: LIVE_SESSION_ENDED
                session:
                  id: brave-teal-otter
                  live_id: 4182
                  state: expired
                  release_reason: idle_timeout
                  platform: android
                  model: pixel-10-api-36
                  client_label: claude-code
                  created_at: '2026-11-10T14:00:00.000Z'
                  started_at: '2026-11-10T14:00:21.000Z'
                  released_at: '2026-11-10T14:31:02.000Z'
                  expires_at: null
                  queue: null
                  time_remaining_s: null
                  idle_remaining_s: null
                  cost_so_far_usd: 0.93
                  last_crash: null
                  install:
                    binary_upload_id: 8a2d4c6e-1f3b-4d5a-8e7c-9b0a1c2d3e4f
                    status: installed
                    error: null
                  warnings: []
                  monitor_url: https://console.devicecloud.dev/device/brave-teal-otter
    LiveNotReady:
      description: >-
        `LIVE_NOT_READY` (425 Too Early): the device is still starting, or an app is still installing. A
        command first waits up to 45 s for it (not while the session is queued), then answers this; `phase`
        says where the device is. Screenshot and inspect answer it, with the `session` block instead of
        `phase`, while the device has no screen to show yet. Retry shortly.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LiveError'
          examples:
            starting:
              summary: The device is still starting
              value:
                statusCode: 425
                message: The device is not ready yet (starting_device). Wait for state "ready", then retry.
                error: LIVE_NOT_READY
                phase: starting_device
            installing:
              summary: An app is still installing
              value:
                statusCode: 425
                message: 'The app is still installing (installing_app). Wait until the session''s install.status is "installed" (over MCP, get_device_status with wait: true waits for it), then retry.'
                error: LIVE_NOT_READY
                phase: installing_app
    LiveRateLimited:
      description: >-
        `LIVE_RATE_LIMITED`: over a per-minute limit. Commands (install, launch, actions, run, request-human,
        hand-back) are limited to 60 a minute per session. Reads (session status, commands, inspect,
        screenshot, logs, timeline, artifacts, human status, and stopping an ended session) are limited to 240
        a minute per session. Session lists, device models and bundle uploads are limited to 120 a minute per
        organization. The body gives the `limit` and `retry_after_s`, the seconds until the window resets. No
        `Retry-After` header is sent. Windows are fixed and one minute long, and each API instance keeps its
        own count.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LiveError'
          example:
            statusCode: 429
            message: 'Too many requests for this session: at most 240 a minute. Retry in 17s.'
            error: LIVE_RATE_LIMITED
            limit: 240
            retry_after_s: 17
    LiveSecretsUnavailable:
      description: >-
        `LIVE_SECRETS_UNAVAILABLE`: this server can't accept secrets (`env` on run, or `sensitive` text) right
        now. Send the command without them.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/LiveError'
          example:
            statusCode: 503
            message: Secrets (env, sensitive text) are not available on this server. Send the command without them.
            error: LIVE_SECRETS_UNAVAILABLE
  schemas:
    ErrorEnvelope:
      type: object
      description: |
        The error body most endpoints use. Some errors add more fields; ignore
        those you don't know.
      required: [statusCode, message]
      properties:
        statusCode:
          type: integer
          description: The HTTP status.
        message:
          description: |
            Human-readable text. Request validation errors give a list, one
            entry per problem.
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        error:
          type: string
          description: |
            A machine-readable code such as `API_KEY_SCOPE` or a `LIVE_*` code,
            or the HTTP status text (`Bad Request`). Match on codes, never on
            status text.
      additionalProperties: true
    InBodyError:
      type: object
      description: |
        A client error that `GET /results/{uploadId}`, `GET /flows` and
        `GET /flows/runs` report in the body of an HTTP `200`.
      required: [statusCode, message]
      properties:
        statusCode:
          type: integer
          const: 400
        message:
          type: string
    MessageOnlyError:
      type: object
      description: The error body of the JUnit and HTML report downloads.
      required: [message]
      properties:
        message:
          type: string
    TestStatus:
      type: string
      description: |
        A test's state. `QUEUED` means waiting for a device. More values may be
        added.
      enum: [PENDING, QUEUED, RUNNING, PASSED, FAILED, CANCELLED]
    Platform:
      type: string
      enum: [android, ios]
    Upload:
      type: object
      required: [id, name, created_at, consoleUrl]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: [string, 'null']
          description: The name given with `dcd cloud --name`, if any.
        created_at:
          type: string
          format: date-time
        consoleUrl:
          type: string
          format: uri
          description: The upload in the console.
    UploadList:
      type: object
      required: [uploads, total, limit, offset]
      properties:
        uploads:
          type: array
          items:
            $ref: '#/components/schemas/Upload'
        total:
          type: integer
          description: How many uploads match, across every page.
        limit:
          type: integer
        offset:
          type: integer
      example:
        uploads:
          - id: 7e12345f-eb12-12ec-a30b-bb1234f1d12a
            name: Nightly regression
            created_at: '2026-01-15T10:30:00+00:00'
            consoleUrl: https://console.devicecloud.dev/results?upload=7e12345f-eb12-12ec-a30b-bb1234f1d12a
        total: 42
        limit: 20
        offset: 0
    UploadStatus:
      type: object
      required: [uploadId, status, name, createdAt, appBinaryId, consoleUrl, tests]
      properties:
        uploadId:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/TestStatus'
          description: |
            The run's overall status, worked out from its tests. Never
            `CANCELLED`: a cancelled test makes the run `FAILED`.
        name:
          type: [string, 'null']
        createdAt:
          type: [string, 'null']
          format: date-time
        appBinaryId:
          type: string
          format: uuid
          description: The ID of the app binary the run tested.
        consoleUrl:
          type: string
          format: uri
          description: The upload in the console, opened at its most recently created test.
        tests:
          type: array
          description: The latest attempt of each test.
          items:
            $ref: '#/components/schemas/UploadStatusTest'
        supersededBy:
          type: string
          format: uuid
          description: |
            Only on a run that a newer run from the same CI context replaced
            (`dcd cloud --cancel-previous`): the newer upload's ID. Its `status`
            is still `FAILED`, because its cancelled tests count against it, so
            check this field before failing a CI job.
      example:
        uploadId: 7e12345f-eb12-12ec-a30b-bb1234f1d12a
        status: FAILED
        name: Nightly regression
        createdAt: '2026-01-15T10:30:00+00:00'
        appBinaryId: 67894274-b789-4c1e-80d4-da8998998999
        consoleUrl: https://console.devicecloud.dev/results?upload=7e12345f-eb12-12ec-a30b-bb1234f1d12a&result=4500
        tests:
          - name: ./login-test/onboarding.yaml
            status: FAILED
            durationSeconds: 32
            failReason: 'Element not found: Text matching regex next.* not found'
            createdAt: '2026-01-15T10:30:04+00:00'
            device: pixel-7-api-34
    UploadStatusTest:
      type: object
      required: [name, status]
      properties:
        name:
          type: string
          description: The flow file, relative to the flows folder that was run.
        status:
          $ref: '#/components/schemas/TestStatus'
        durationSeconds:
          type: integer
          description: Left out until the test has a duration.
        failReason:
          type: string
          description: Only on a `FAILED` test with a recorded reason.
        createdAt:
          type: string
          format: date-time
        device:
          type: string
          description: The device the test ran on, such as `pixel-7-api-34` or `iPhone 16 - 18`.
    ResultsResponse:
      type: object
      required: [statusCode, results]
      properties:
        statusCode:
          type: integer
          const: 200
        results:
          type: array
          description: Every attempt of every test, ordered by `id`.
          items:
            $ref: '#/components/schemas/Result'
    Result:
      type: object
      description: |
        One attempt at one test. Fields marked "full view only" are left out with
        `view=summary`.
      required:
        - id
        - test_file_name
        - status
        - retry_of
        - duration_seconds
        - fail_reason
        - cancellation_reason
        - simulator_name
        - config
      properties:
        id:
          type: integer
          description: The result ID.
        test_file_name:
          type: string
          description: The flow file, relative to the flows folder that was run.
          example: ./login-test/onboarding.yaml
        test_name:
          type: [string, 'null']
          description: The flow's name. Full view only.
        status:
          $ref: '#/components/schemas/TestStatus'
          description: |
            The test's state. This endpoint still reports a queued test as
            `PENDING` rather than `QUEUED`, so treat both as "not started yet".
        retry_of:
          type: [integer, 'null']
          description: For a retry, the `id` of the attempt it retried.
        created_at:
          type: string
          format: date-time
          description: Full view only.
        duration_seconds:
          type: [integer, 'null']
        fail_reason:
          type: [string, 'null']
        cancellation_reason:
          type: [string, 'null']
          description: |
            Why a cancelled test was cancelled, when a reason was recorded.
            `superseded_by:<upload id>` means a newer run from the same CI context
            replaced this one. `Cancelled: payment for this run failed.` means the
            run's payment failed after its tests were created. A test you cancel
            yourself has `null`. Match on the `superseded_by:` prefix, as more
            reasons may be added.
        simulator_name:
          type: string
          description: The device the test ran on, such as `pixel-7-api-34`.
        platform:
          $ref: '#/components/schemas/Platform'
          description: Full view only.
        config:
          type: object
          description: |
            The test's run settings. With `view=summary`, only `deviceName` and
            `osVersion`, each left out when not recorded.
          properties:
            deviceName:
              type: string
              example: Pixel 7
            osVersion:
              type: [string, number]
              example: '34'
          additionalProperties: true
        result_files:
          type: [object, 'null']
          description: |
            References to the test's stored logs, screenshots and video, with the
            step log itself in `main_log` when it is 512 KB or smaller. Full view
            only. To download the files, use `POST /results/{uploadId}/download`.
          additionalProperties: true
    DownloadArtifactsRequest:
      type: object
      required: [results]
      properties:
        results:
          type: string
          enum: [FAILED, ALL]
          description: |
            `FAILED` for the failed tests' files only, `ALL` for every test's.
            Any other value counts as `ALL`.
    FlowSummaries:
      type: object
      required: [statusCode, flows]
      properties:
        statusCode:
          type: integer
          const: 200
        flows:
          type: array
          items:
            $ref: '#/components/schemas/FlowSummary'
    FlowSummary:
      type: object
      required:
        - flow_name
        - file_name
        - last_run_at
        - total_runs
        - passed_runs
        - failed_runs
        - pass_rate
        - avg_duration
        - daily_data
        - tags
      properties:
        flow_name:
          type: string
        file_name:
          type: string
          description: The flow file, relative to the flows folder that was run. Pass it to `GET /flows/runs`.
        last_run_at:
          type: string
          format: date-time
        total_runs:
          type: integer
          description: |
            Every run in the range whatever its status, including cancelled and
            unfinished runs and each retry, so it can be more than
            `passed_runs` + `failed_runs`.
        passed_runs:
          type: integer
        failed_runs:
          type: integer
        pass_rate:
          type: integer
          minimum: 0
          maximum: 100
          description: '`passed / (passed + failed)` as a whole percentage. `0` when nothing passed or failed.'
        avg_duration:
          type: integer
          description: Average duration in seconds.
        daily_data:
          type: object
          description: |
            Each day with runs (`YYYY-MM-DD`, UTC) and how it went: `passed` (runs
            passed and none failed), `failed` (runs failed and none passed),
            `mixed` (both), or `null` (runs, but none passed or failed, for example
            all cancelled). Days without runs have no entry.
          additionalProperties:
            type: [string, 'null']
            enum: [passed, failed, mixed, null]
        tags:
          type: array
          items:
            type: string
    FlowRuns:
      type: object
      required: [statusCode, runs]
      properties:
        statusCode:
          type: integer
          const: 200
        runs:
          type: array
          items:
            $ref: '#/components/schemas/FlowRun'
    FlowRun:
      type: object
      required: [id, status, createdAt, durationSeconds, failReason, testUploadId, uploadName]
      properties:
        id:
          type: integer
          description: The result ID.
        status:
          $ref: '#/components/schemas/TestStatus'
        createdAt:
          type: string
          format: date-time
        durationSeconds:
          type: [integer, 'null']
        failReason:
          type: [string, 'null']
        testUploadId:
          type: string
          format: uuid
          description: The upload the run belongs to.
        uploadName:
          type: [string, 'null']
    IpAddresses:
      type: object
      required: [updatedAt, ipAddresses, ranges]
      properties:
        updatedAt:
          type: string
          format: date
          description: When the list last changed.
        ipAddresses:
          type: array
          description: Every address as a bare IP, the simplest thing to allow-list.
          items:
            type: string
        ranges:
          type: array
          description: Each range in detail. If your firewall takes CIDR notation, allow-list these.
          items:
            $ref: '#/components/schemas/IpRange'
      example:
        updatedAt: '2026-07-06'
        ipAddresses: [46.17.215.144, 46.17.215.145, 83.217.174.249]
        ranges:
          - cidr: 46.17.215.144/32
            platforms: [android, ios]
            type: egress
            description: Test runner egress
    IpRange:
      type: object
      required: [cidr, platforms, type, description]
      properties:
        cidr:
          type: string
          description: The range in CIDR notation. A single host is a `/32`.
        platforms:
          type: array
          description: The runner platforms whose traffic leaves from this range.
          items:
            $ref: '#/components/schemas/Platform'
        type:
          type: string
          description: The kind of traffic. Currently always `egress`, outbound from the app under test.
          enum: [egress]
        description:
          type: string
    LiveError:
      type: object
      description: >-
        The error body. `statusCode` equals the HTTP status and `message` is for people. `error`, when present,
        is a stable code to branch on. Some errors add fields: `session` (the session block), `phase`
        (LIVE_NOT_READY from a command), `limit` and `retry_after_s` (LIVE_RATE_LIMITED), `limit`
        (LIVE_CONCURRENCY_LIMIT), and `limit` and `spent` (LIVE_SPEND_CAP). Ignore fields you don't know.
      required: [statusCode, message]
      properties:
        statusCode:
          type: integer
          description: The HTTP status.
          example: 409
        message:
          type: string
          description: What went wrong, in words. Don't branch on it.
        error:
          type: string
          description: |-
            A stable code. Absent on errors that carry none: validation and payment errors when starting a session, an invalid `before` on artifacts, and 5xx errors other than the ones below.

            - `LIVE_NOT_ENABLED` (403): device sessions aren't enabled for your organization.
            - `LIVE_CONCURRENCY_LIMIT` (409): your organization has as many sessions open as it may.
            - `LIVE_SPEND_CAP` (402): your organization reached its monthly spend cap.
            - `LIVE_NOT_FOUND` (404): no such session in your organization.
            - `LIVE_NOT_READY` (425): the device is still starting, or an app is installing. Retry shortly.
            - `LIVE_SESSION_ENDED` (409): the session has ended.
            - `LIVE_INVALID_ACTION` (400): the request is malformed. The message says how.
            - `LIVE_INVALID_APP` (400): the build isn't one this device can install, or the install request named neither or both of a build and a URL.
            - `LIVE_APP_DOWNLOAD_FAILED` (400): the build at the URL couldn't be downloaded.
            - `LIVE_NO_APP` (409): no app is installed, and none was named.
            - `LIVE_COMMAND_NOT_FOUND` (404): no such command in this session.
            - `LIVE_LOGS_UNAVAILABLE` (502): the device logs couldn't be read.
            - `LIVE_SESSION_REQUIRED`: MCP only, never returned by this API. More than one session is open, so pass `session_id`.
            - `LIVE_RATE_LIMITED` (429): too many requests. Wait `retry_after_s` seconds.
            - `LIVE_NOT_WAITING_FOR_HUMAN` (409): hand-back on a session that isn't waiting for a person.
            - `LIVE_HUMAN_IN_CONTROL` (409): a person has taken control in the console. Wait for them to hand back.
            - `LIVE_CONSOLE_ONLY` (403): only a person signed in to the console can do this (take control).
            - `LIVE_NOT_IN_CONTROL` (409): only the person in control can do this (remove a held step).
            - `LIVE_SECRETS_UNAVAILABLE` (503): secrets can't be accepted right now.
          enum:
            - LIVE_NOT_ENABLED
            - LIVE_CONCURRENCY_LIMIT
            - LIVE_SPEND_CAP
            - LIVE_NOT_FOUND
            - LIVE_NOT_READY
            - LIVE_SESSION_ENDED
            - LIVE_INVALID_ACTION
            - LIVE_INVALID_APP
            - LIVE_APP_DOWNLOAD_FAILED
            - LIVE_NO_APP
            - LIVE_COMMAND_NOT_FOUND
            - LIVE_LOGS_UNAVAILABLE
            - LIVE_SESSION_REQUIRED
            - LIVE_RATE_LIMITED
            - LIVE_NOT_WAITING_FOR_HUMAN
            - LIVE_HUMAN_IN_CONTROL
            - LIVE_CONSOLE_ONLY
            - LIVE_NOT_IN_CONTROL
            - LIVE_SECRETS_UNAVAILABLE
        session:
          $ref: '#/components/schemas/SessionBlock'
          description: >-
            The session's block, on LIVE_SESSION_ENDED, LIVE_NOT_WAITING_FOR_HUMAN, LIVE_LOGS_UNAVAILABLE, and
            LIVE_NOT_READY from screenshot, inspect and request-human.
        phase:
          type: [string, 'null']
          description: >-
            LIVE_NOT_READY from a command only. The device's phase: `pending`, `cloning_device`, `starting_device`,
            `booting_hierarchy` or `booting_screenshot` while it starts; `downloading_app` or `installing_app`
            while an app installs. Null when the device has reported no phase yet.
          example: installing_app
        limit:
          type: number
          description: >-
            LIVE_RATE_LIMITED from a per-minute limit: requests allowed a minute. LIVE_CONCURRENCY_LIMIT: sessions
            your organization may have open. LIVE_SPEND_CAP: the monthly cap, in USD.
        retry_after_s:
          type: integer
          minimum: 0
          description: LIVE_RATE_LIMITED from a per-minute limit. Seconds until the window resets.
        spent:
          type: number
          description: LIVE_SPEND_CAP only. What your organization has spent on device sessions this month, in USD.

    SessionBlock:
      type: object
      description: >-
        The compact block every device session response carries as `session`, so you always know the state,
        the time left and the cost without another call.
      required:
        - id
        - live_id
        - state
        - release_reason
        - platform
        - model
        - client_label
        - created_at
        - started_at
        - released_at
        - expires_at
        - queue
        - time_remaining_s
        - idle_remaining_s
        - cost_so_far_usd
        - last_crash
        - install
        - warnings
        - monitor_url
      properties:
        id:
          type: string
          description: The session id. Every path takes it.
          example: brave-teal-otter
        live_id:
          type: integer
          description: The session's numeric id. Paths take it too.
          example: 4182
        state:
          type: string
          description: >-
            Where the session is. `queued`: waiting for a free device. `provisioning`: a device is starting.
            `ready`: the device is up. `active`: commands have been sent. `needs_human`: waiting for a person.
            `released`, `expired` and `failed` are ended.
          enum: [queued, provisioning, ready, active, needs_human, released, expired, failed]
        release_reason:
          type: [string, 'null']
          description: Why the session ended. Null while it is open.
          enum:
            - user_stop
            - idle_timeout
            - max_duration
            - queue_timeout
            - spend_cap
            - runner_error
            - heartbeat_lost
            - needs_human_timeout
            - other
            - null
        platform:
          type: string
          enum: [ios, android]
        model:
          type: [string, 'null']
          description: >-
            The device, in the form GET /device/models uses: `iphone-16-ios-26.4`, or `pixel-10-api-36`
            (`-play` with Google Play). The OS version gets more precise once the device has started.
          example: pixel-10-api-36
        client_label:
          type: [string, 'null']
          description: Who is driving the session, such as `claude-code`.
        created_at:
          type: string
          format: date-time
          description: When the session was asked for.
        started_at:
          type: [string, 'null']
          format: date-time
          description: When a device was assigned, which is when billing starts. Null while queued.
        released_at:
          type: [string, 'null']
          format: date-time
          description: When it ended. Null while it is open.
        expires_at:
          type: [string, 'null']
          format: date-time
          description: When its maximum duration ends it. Null before a device is assigned, and once it has ended.
        queue:
          description: Only while `queued`. Null otherwise.
          oneOf:
            - $ref: '#/components/schemas/SessionQueue'
            - type: 'null'
        time_remaining_s:
          type: [integer, 'null']
          minimum: 0
          description: Seconds until the maximum duration. Null before a device is assigned, and once it has ended.
        idle_remaining_s:
          type: [integer, 'null']
          minimum: 0
          description: >-
            Seconds until the idle timeout (5 minutes without a command). Null when the device isn't running,
            and while the session waits for a person.
        cost_so_far_usd:
          type: [number, 'null']
          description: >-
            What the session has cost so far at your organization's rate, in USD: the charge if it ended now.
            Null when it couldn't be read.
        last_crash:
          description: The app's most recent crash in this session, or null.
          oneOf:
            - $ref: '#/components/schemas/AppCrash'
            - type: 'null'
        install:
          description: The build the session was asked to install, and where that install is. Null when none was asked for.
          oneOf:
            - $ref: '#/components/schemas/SessionInstall'
            - type: 'null'
        warnings:
          type: array
          description: Plain-English notices, such as a long queue, an upcoming idle timeout, a crash or a failed install.
          items:
            type: string
        monitor_url:
          type: string
          format: uri
          description: The session's page in the console, where people can watch the screen and take control.
          example: https://console.devicecloud.dev/device/brave-teal-otter

    SessionQueue:
      type: object
      required: [position, eta_s, waited_s, reason]
      properties:
        position:
          type: [integer, 'null']
          description: The session's place in the queue.
        eta_s:
          type: [integer, 'null']
          description: >-
            An estimate of the seconds still to wait. Null when there is no basis for one, or once the wait has
            run past the usual one.
        waited_s:
          type: [integer, 'null']
          description: Seconds since the session was created.
        reason:
          type: string
          description: >-
            `fleet_busy`: the platform is at the fleet-wide limit on device sessions. `waiting_for_device`: under
            that limit, waiting for a free device. Neither is an error; the session starts on its own.
          enum: [fleet_busy, waiting_for_device]

    SessionInstall:
      type: object
      required: [binary_upload_id, status, error]
      properties:
        binary_upload_id:
          type: string
          description: The build asked for.
        status:
          type: string
          description: '`installing` (the device hasn''t finished it), `installed`, or `failed`.'
          enum: [installing, installed, failed]
        error:
          type: [string, 'null']
          description: Why the install failed. Null unless `status` is `failed`.

    AppCrash:
      type: object
      required: [at, summary]
      properties:
        at:
          type: string
          description: When the app crashed, as the device saw it.
        summary:
          type: string
          description: A one-line summary of the crash. GET .../logs has the details.

    SessionResponse:
      type: object
      required: [session]
      properties:
        session:
          $ref: '#/components/schemas/SessionBlock'

    SessionListResponse:
      type: object
      required: [sessions]
      properties:
        sessions:
          type: array
          maxItems: 100
          description: The sessions' blocks, newest first.
          items:
            $ref: '#/components/schemas/SessionBlock'

    DeviceModel:
      type: object
      required: [model, name, os, default_os, google_play, default]
      properties:
        model:
          type: string
          description: What `model` takes, such as `iphone-16` or `pixel-10`.
        name:
          type: string
          description: The device's name, such as `iPhone 16`.
        os:
          type: array
          description: What `os` takes for this model. The iOS major version, or the Android API level.
          items:
            type: string
        default_os:
          type: string
          description: The OS version a session gets when it names none.
        google_play:
          type: boolean
          description: An Android image with Google Play services. Start it with `googlePlay` true.
        default:
          type: boolean
          description: The model a session gets when it names none.

    DeviceCatalogue:
      type: object
      required: [ios, android]
      properties:
        ios:
          type: array
          items:
            $ref: '#/components/schemas/DeviceModel'
        android:
          type: array
          items:
            $ref: '#/components/schemas/DeviceModel'

    StartSessionRequest:
      type: object
      required: [platform]
      properties:
        platform:
          type: string
          enum: [ios, android]
        model:
          type: string
          description: A model from GET /device/models, such as `iphone-16` or `pixel-10`. Default is the platform's default model.
        os:
          type: string
          description: >-
            The iOS major version (such as `26`) or Android API level (such as `36`), from GET /device/models.
            A string. Default is the model's default.
        googlePlay:
          type: boolean
          description: Android only. An image with Google Play services. Sending it on iOS is a 400.
        binaryUploadId:
          type: string
          description: An uploaded build to install once the device is ready. It must be your organization's and for this platform.
        deviceLocale:
          type: string
          pattern: '^[a-z]{2,3}_[A-Z]{2}$'
          description: The device's locale, such as `de_DE`. Default is the device's own.
        maxDurationMin:
          type: integer
          minimum: 1
          maximum: 60
          description: >-
            End the session after this many minutes. Default and ceiling is your organization's limit, which is
            at most 60.
        clientLabel:
          type: string
          pattern: '^[A-Za-z0-9][A-Za-z0-9 ._/-]{0,63}$'
          maxLength: 64
          description: Who is driving the session, such as `claude-code`. Shown to people watching it.
        record:
          type: boolean
          default: true
          description: >-
            Record the session's video. Only `false` turns it off. A screenshot after each action and the device
            log are kept either way.
        androidDevice:
          type: string
          deprecated: true
          description: >-
            Older form of `model` for Android, such as `pixel-8`. Needs `androidApiLevel`, and can't be mixed with
            `model`, `os` or `googlePlay`.
        androidApiLevel:
          type: string
          deprecated: true
          description: Older form of `os` for Android, such as `34`. Needs `androidDevice`.

    InstallRequest:
      type: object
      description: Pass `binaryUploadId` or `url`, not both.
      properties:
        binaryUploadId:
          type: string
          description: An uploaded build of your organization's, for the session's platform.
        url:
          type: string
          format: uri
          pattern: '^https://'
          description: >-
            An https link to an `.apk`, or to a zipped simulator `.app` for iOS, up to 500 MB. It must be a public
            host with no user name or password in the URL. The download may take up to 120 s and follow up to 5
            redirects. A build your organization already has (the same bytes) is reused.
      oneOf:
        - required: [binaryUploadId]
        - required: [url]

    InstallResponse:
      type: object
      required: [app, session]
      properties:
        app:
          type: object
          required: [binary_upload_id, app_id, reused]
          properties:
            binary_upload_id:
              type: string
              description: The build being installed. For a URL, the build it was stored as.
            app_id:
              type: [string, 'null']
              description: The build's bundle id or package name. Null when it isn't known.
            reused:
              type: boolean
              description: >-
                True when no new build was stored: always for `binaryUploadId`, and for a `url` whose build your
                organization already had.
        session:
          $ref: '#/components/schemas/SessionBlock'

    LaunchRequest:
      type: object
      properties:
        appId:
          type: string
          minLength: 1
          maxLength: 255
          pattern: '^[A-Za-z0-9._-]+$'
          description: A bundle id or package name. Default is the installed build's.
          example: com.apple.Preferences
        clearState:
          type: boolean
          description: Clear the app's data before launching it.

    DeviceAction:
      description: One action. `type` picks which, and its other fields.
      oneOf:
        - $ref: '#/components/schemas/TapAction'
        - $ref: '#/components/schemas/TypeAction'
        - $ref: '#/components/schemas/SwipeAction'
        - $ref: '#/components/schemas/PressKeyAction'
      discriminator:
        propertyName: type
        mapping:
          tap: '#/components/schemas/TapAction'
          type: '#/components/schemas/TypeAction'
          swipe: '#/components/schemas/SwipeAction'
          press_key: '#/components/schemas/PressKeyAction'

    TapAction:
      type: object
      description: >-
        Tap one target: a point (`x` and `y`), an element's `text`, or its `id`. Exactly one. Text and ids are
        matched whole and ignoring case, literally, not as regular expressions. A target that is not on
        screen waits about 17 s before the tap fails.
      required: [type]
      properties:
        type:
          type: string
          const: tap
        mode:
          $ref: '#/components/schemas/ActionMode'
        x:
          type: number
          minimum: 0
          maximum: 100
          description: Percent of the screen's width, from the left. Rounded to a whole number.
        y:
          type: number
          minimum: 0
          maximum: 100
          description: Percent of the screen's height, from the top. Rounded to a whole number.
        text:
          type: string
          minLength: 1
          maxLength: 1000
          description: The element's text or accessibility label (`txt` or `a11y` in inspect).
        id:
          type: string
          minLength: 1
          maxLength: 1000
          description: The element's id (`rid` in inspect).
      oneOf:
        - required: [x, y]
        - required: [text]
        - required: [id]

    TypeAction:
      type: object
      description: Type text into the focused field.
      required: [type, text]
      properties:
        type:
          type: string
          const: type
        mode:
          $ref: '#/components/schemas/ActionMode'
        text:
          type: string
          minLength: 1
          maxLength: 1000
        sensitive:
          type: boolean
          default: false
          description: >-
            The text is a secret. It is encrypted before it is stored, never shown in the timeline, and masked
            in inspect. Answers 503 LIVE_SECRETS_UNAVAILABLE when the server can't take secrets.

    SwipeAction:
      type: object
      description: Swipe in a `direction`, or `from` one point `to` another. Not both.
      required: [type]
      properties:
        type:
          type: string
          const: swipe
        mode:
          $ref: '#/components/schemas/ActionMode'
        direction:
          type: string
          enum: [up, down, left, right]
        from:
          $ref: '#/components/schemas/ScreenPoint'
        to:
          $ref: '#/components/schemas/ScreenPoint'
      oneOf:
        - required: [direction]
        - required: [from, to]

    PressKeyAction:
      type: object
      description: Press a device key.
      required: [type, key]
      properties:
        type:
          type: string
          const: press_key
        mode:
          $ref: '#/components/schemas/ActionMode'
        key:
          type: string
          enum: [back, home, enter, backspace, tab, volume_up, volume_down, lock, power]

    ActionMode:
      type: string
      enum: [maestro]
      description: >-
        `maestro` runs the action as a one-command Maestro flow instead of directly on the device: slower,
        with Maestro's own waits. Leave it out otherwise.

    ScreenPoint:
      type: object
      description: A point on the screen, in percent. Each value is rounded to a whole number.
      required: [x, y]
      properties:
        x:
          type: number
          minimum: 0
          maximum: 100
          description: Percent of the screen's width, from the left.
        y:
          type: number
          minimum: 0
          maximum: 100
          description: Percent of the screen's height, from the top.

    CommandResult:
      type: object
      description: >-
        How the command went on the device. A command that waited 120 s without finishing fails with a timeout
        error. One held because a person took control fails with a message saying it will run after the
        hand-back; follow it on the timeline.
      required: [success]
      properties:
        success:
          type: boolean
        output:
          type: string
          description: What Maestro reported. Often a JSON document in a string.
        error:
          type: string
          description: Why it failed.

    CommandResponse:
      type: object
      required: [result, session]
      properties:
        result:
          $ref: '#/components/schemas/CommandResult'
        session:
          $ref: '#/components/schemas/SessionBlock'

    RunRequest:
      type: object
      description: Pass `yaml` or `flowUploadId`, not both.
      properties:
        yaml:
          type: string
          pattern: '\S'
          description: >-
            One Maestro flow, run whole: a header naming the app, `---`, then commands. Without a header, the
            installed build's app id is used.
        flowUploadId:
          type: string
          format: uuid
          description: A flow bundle of your organization's, from POST /device/bundles.
        flow:
          type: string
          pattern: '^(?!/)(?!.*(^|/)\.\.(/|$))[\w .@+-]+(/[\w .@+-]+)*\.ya?ml$'
          description: >-
            With `flowUploadId` only. The entry file inside the bundle, as a relative path such as
            `flows/login.yaml`. Without it, every flow in the bundle runs.
        env:
          type: object
          description: >-
            Secrets and variables for the flow, used in the YAML as `${NAME}`. They are encrypted before they are
            stored, never shown in the timeline, and masked in the output and in inspect. Names starting with
            `DCD_` (any case) are reserved. Answers 503 LIVE_SECRETS_UNAVAILABLE when the server can't take
            secrets.
          maxProperties: 50
          propertyNames:
            pattern: '^(?![Dd][Cc][Dd]_)[A-Za-z_][A-Za-z0-9_]{0,63}$'
          additionalProperties:
            type: string
            maxLength: 4096
          example:
            PASSWORD: correct-horse-battery
        waitSeconds:
          type: number
          minimum: 0
          maximum: 300
          default: 110
          description: >-
            How long to wait for the flow before answering `running`, in seconds. Time spent waiting for the
            device to be ready counts against it.
      oneOf:
        - required: [yaml]
        - required: [flowUploadId]

    RunResponse:
      type: object
      required: [command_id, status, result, session]
      properties:
        command_id:
          type: string
          format: uuid
          description: The command's id. Follow a `running` one at GET /device/sessions/{id}/commands/{commandId}.
        status:
          type: string
          description: '`running` when the flow outlasted the wait.'
          enum: [passed, failed, running]
        result:
          description: The flow's result. Null while it is `running`.
          oneOf:
            - $ref: '#/components/schemas/RunResult'
            - type: 'null'
        session:
          $ref: '#/components/schemas/SessionBlock'

    RunResult:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
        output:
          type: string
          description: >-
            Maestro's report, usually a JSON document in a string. Variable values are never included, and a
            failed run's command count is left out.
        error:
          type: string
          description: >-
            Why the run failed, in words: for a bundle, which flows failed and why. Includes where it failed when
            that is known.
        flows:
          type: array
          description: Each flow's outcome, for a run that reported them (a bundle).
          items:
            $ref: '#/components/schemas/RunFlowResult'
        failed_at:
          $ref: '#/components/schemas/FailureLocation'
        failed_at_candidates:
          type: array
          minItems: 2
          description: Two or more commands fit the error, and any of them may have failed. Instead of `failed_at`.
          items:
            $ref: '#/components/schemas/FailureLocation'
        screen_text:
          type: array
          maxItems: 60
          description: >-
            A failed run only: the app's visible text just after the failure, without the keyboard and System UI.
            Present when the screen could be read.
          items:
            type: string

    RunFlowResult:
      type: object
      required: [file, success, error]
      properties:
        file:
          type: string
          description: The flow's path inside the bundle.
        success:
          type: boolean
        error:
          type: [string, 'null']
        failed_at:
          $ref: '#/components/schemas/FailureLocation'
        failed_at_candidates:
          type: array
          minItems: 2
          items:
            $ref: '#/components/schemas/FailureLocation'

    FailureLocation:
      type: object
      description: Where a flow failed.
      required: [file, line, command, call_chain]
      properties:
        file:
          type: string
          description: The file, as a path inside the bundle. `flow.yaml` for an inline flow.
        line:
          type: integer
          minimum: 1
          description: The line in that file, from 1.
        command:
          type: [string, 'null']
          description: The command as written, on one line. Null when only the position is known.
        call_chain:
          type: array
          description: The `runFlow` lines that led there, outermost first, such as `main.yaml:4`.
          items:
            type: string

    CompactElement:
      type: object
      description: >-
        One element on the screen. Keys other than `b` appear only when they apply; the state keys only when
        they aren't the default.
      required: [b]
      properties:
        b:
          type: string
          description: Bounds, `[left,top][right,bottom]`, in the screen's own units.
          example: '[63,904][1017,1052]'
        txt:
          type: string
          description: Text. Use it as tapOn text.
        rid:
          type: string
          description: Resource id. Use it as tapOn id.
        a11y:
          type: string
          description: Accessibility label, when it differs from `txt`. Use it as tapOn text.
        hint:
          type: string
          description: Hint or placeholder text.
        checked:
          type: boolean
          const: true
        selected:
          type: boolean
          const: true
        focused:
          type: boolean
          const: true
        enabled:
          type: boolean
          const: false
          description: Present only when the element is disabled.

    CompactScreen:
      type: object
      required: [width, height, keys, elements]
      properties:
        width:
          type: number
        height:
          type: number
        keys:
          type: object
          description: What each element key means. The same in every response.
          additionalProperties:
            type: string
        elements:
          type: array
          items:
            $ref: '#/components/schemas/CompactElement'
        keyboard_open:
          type: boolean
          const: true
          description: Android only. An on-screen keyboard is showing.
        hidden:
          type: object
          description: >-
            Android only, and only when some were left out: how many keyboard keys and System UI elements (status
            bar, navigation bar) were hidden. `all=true` shows them.
          required: [keyboard, system]
          properties:
            keyboard:
              type: integer
              minimum: 0
            system:
              type: integer
              minimum: 0

    InspectResponse:
      type: object
      required: [screen, session]
      properties:
        screen:
          allOf:
            - $ref: '#/components/schemas/CompactScreen'
            - type: object
              required: [fresh]
              properties:
                fresh:
                  type: boolean
                  description: False when no screen read came after your last command in time; this is then the latest.
        session:
          $ref: '#/components/schemas/SessionBlock'

    ScreenshotResponse:
      type: object
      required: [screenshot, session]
      properties:
        screenshot:
          type: object
          required: [data_url, captured_at, fresh]
          properties:
            data_url:
              type: string
              description: The screen as a JPEG data URL.
            captured_at:
              type: [string, 'null']
              format: date-time
              description: When the device took it, on the device host's clock.
            fresh:
              type: boolean
              description: False when no new frame came within 3 s; this is then the latest there is.
        session:
          $ref: '#/components/schemas/SessionBlock'

    LogsResponse:
      type: object
      required: [logs, session]
      properties:
        logs:
          type: object
          required: [lines, source, app_id, scanned]
          properties:
            lines:
              type: array
              description: The lines, oldest first, at most 24 KB in all.
              items:
                type: string
            source:
              type: string
              description: '`logcat` (Android), `ios-unified-log` (iOS), or `none` before an app is installed.'
              enum: [logcat, ios-unified-log, none]
            app_id:
              type: [string, 'null']
              description: The app the lines belong to. Null when no app is installed.
            scanned:
              type: integer
              minimum: 0
              description: How many of the app's newest lines were read to find these.
            truncated:
              type: boolean
              const: true
              description: Present only when older matching lines were left out to keep the answer under 24 KB.
        session:
          $ref: '#/components/schemas/SessionBlock'

    HumanStatus:
      type: object
      required:
        - waiting
        - reason
        - since
        - expires_at
        - handed_back
        - note
        - handed_back_at
        - human_in_control
        - controller_user_id
      properties:
        waiting:
          type: boolean
          description: The session is `needs_human`. Keep polling.
        reason:
          type: [string, 'null']
          description: Why help was asked for, while waiting.
        since:
          type: [string, 'null']
          format: date-time
          description: When help was asked for, while waiting.
        expires_at:
          type: [string, 'null']
          format: date-time
          description: While waiting, when the session ends unless a person hands it back.
        handed_back:
          type: boolean
          description: A person handed the session back since help was last asked for.
        note:
          type: [string, 'null']
          description: The person's note, if they left one.
        handed_back_at:
          type: [string, 'null']
          format: date-time
        human_in_control:
          type: boolean
          description: A person has taken control in the console. Commands that change the device answer 409 LIVE_HUMAN_IN_CONTROL meanwhile.
        controller_user_id:
          type: [string, 'null']
          description: The console user who has control, if anyone.

    HumanResponse:
      type: object
      required: [session, human]
      properties:
        session:
          $ref: '#/components/schemas/SessionBlock'
        human:
          $ref: '#/components/schemas/HumanStatus'

    RequestHumanRequest:
      type: object
      required: [reason]
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          description: What the person should do. Leading and trailing spaces are trimmed before the length check.
          example: Enter the 2FA code sent to the test phone, then hand back

    HandBackRequest:
      type: object
      properties:
        note:
          type: string
          maxLength: 2000
          description: A note for the agent. Trimmed; a blank note counts as none.
          example: Code entered, you're on the home screen

    ArtifactLink:
      type: object
      required: [url, content_type, bytes, created_at]
      properties:
        url:
          type: [string, 'null']
          format: uri
          description: A download link that works for about an hour. Null when no link could be made.
        content_type:
          type: string
          description: Such as `video/mp4`, `text/plain`, `image/jpeg` or `application/json`.
        bytes:
          type: [integer, 'null']
          minimum: 0
        created_at:
          type: string
          format: date-time

    ArtifactAction:
      type: object
      required: [command_id, created_at, screenshot, hierarchy]
      properties:
        command_id:
          type: [string, 'null']
          format: uuid
          description: The command the screen was captured after.
        created_at:
          type: string
          format: date-time
        screenshot:
          description: The screen after the action.
          oneOf:
            - $ref: '#/components/schemas/ArtifactLink'
            - type: 'null'
        hierarchy:
          description: The screen dump after the action, as JSON.
          oneOf:
            - $ref: '#/components/schemas/ArtifactLink'
            - type: 'null'

    ArtifactsResponse:
      type: object
      required: [session, recording, logs, actions, next_before, pending]
      properties:
        session:
          $ref: '#/components/schemas/SessionBlock'
        recording:
          description: The session's video. Null until it arrives, or when the session wasn't recorded.
          oneOf:
            - $ref: '#/components/schemas/ArtifactLink'
            - type: 'null'
        logs:
          description: The session's device log file. Null until it arrives.
          oneOf:
            - $ref: '#/components/schemas/ArtifactLink'
            - type: 'null'
        actions:
          type: array
          description: The screen after each action, newest first.
          items:
            $ref: '#/components/schemas/ArtifactAction'
        next_before:
          type: [string, 'null']
          format: date-time
          description: Pass as `before` for the next, older page. Null on the last page.
        pending:
          type: array
          description: >-
            Files still on their way after the session ended: ask again shortly. Empty while the session is open,
            and when nothing more is expected.
          items:
            type: string
            enum: [recording, logs]

    TimelineEntry:
      type: object
      required:
        - command_id
        - kind
        - source
        - client_label
        - actor
        - actor_email
        - status
        - created_at
        - completed_at
        - input
        - output
        - error
        - redacted
        - screenshot
      properties:
        command_id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
            - exec
            - run
            - tap
            - type
            - swipe
            - press_key
            - launch
            - install
            - stop
            - logs
            - human_input
            - request_human
            - hand_back
        source:
          type: string
          description: Where it came from, from the `x-dcd-source` header.
          enum: [cli, mcp, web, api]
        client_label:
          type: [string, 'null']
        actor:
          type: [string, 'null']
          description: Sent by a signed-in user, or with an API key.
          enum: [user, api_key, null]
        actor_email:
          type: [string, 'null']
          description: The user's email when `actor` is `user` and it could be looked up.
        status:
          type: string
          enum: [pending, running, passed, failed, timeout]
        created_at:
          type: string
          format: date-time
        completed_at:
          type: [string, 'null']
          format: date-time
        input:
          type: [string, 'null']
          description: What was sent, such as the YAML. Cut to 2000 characters, with a trailing `…`.
        output:
          type: [string, 'null']
          description: Cut to 2000 characters.
        error:
          type: [string, 'null']
          description: Cut to 2000 characters.
        redacted:
          type: boolean
          description: The command carried a secret, which is not shown.
        screenshot:
          description: The screen after it, when one was captured.
          oneOf:
            - $ref: '#/components/schemas/ArtifactLink'
            - type: 'null'

    TimelineResponse:
      type: object
      required: [session, timeline, next_before]
      properties:
        session:
          $ref: '#/components/schemas/SessionBlock'
        timeline:
          type: array
          description: Newest first.
          items:
            $ref: '#/components/schemas/TimelineEntry'
        next_before:
          type: [string, 'null']
          format: date-time
          description: Pass as `before` for the next, older page. Null on the last page.

    BundleUploadUrlRequest:
      type: object
      properties:
        bytes:
          type: integer
          minimum: 1
          maximum: 52428800
          description: The zip's size in bytes, at most 50 MB.

    SignedUpload:
      type: object
      required: [path, signedUrl]
      properties:
        path:
          type: string
          description: Where the zip will be stored.
        signedUrl:
          type: string
          format: uri
          description: '`PUT` the zip here.'

    BundleUploadUrls:
      type: object
      required: [id, upload, mirror]
      properties:
        id:
          type: string
          format: uuid
          description: The bundle's id. Register it with this.
        upload:
          description: One copy. Null when it couldn't be signed.
          oneOf:
            - $ref: '#/components/schemas/SignedUpload'
            - type: 'null'
        mirror:
          description: The other copy. Null when it couldn't be signed. Upload to both when both are given.
          oneOf:
            - $ref: '#/components/schemas/SignedUpload'
            - type: 'null'

    RegisterBundleRequest:
      type: object
      required: [id, sha, bytes]
      description: Set `supabase` or `backblaze` true, or both, for the URLs you uploaded to.
      properties:
        id:
          type: string
          format: uuid
          description: The id from POST /device/bundles/upload-url.
        sha:
          type: string
          pattern: '^[0-9a-fA-F]{64}$'
          description: The SHA-256 of the zip, in hex.
        bytes:
          type: integer
          minimum: 1
          maximum: 52428800
          description: The zip's size in bytes, at most 50 MB.
        supabase:
          type: boolean
          description: You uploaded to the `upload` URL.
        backblaze:
          type: boolean
          description: You uploaded to the `mirror` URL.
        enc:
          $ref: '#/components/schemas/BundleEnvelope'

    BundleEnvelope:
      type: object
      description: For a zip encrypted on the client, the key envelope it was encrypted with. Used by the `dcd` CLI.
      required: [v, kek, wrapped_key]
      properties:
        v:
          type: number
        kek:
          type: number
        wrapped_key:
          type: string

    FlowBundle:
      type: object
      required: [id, sha, bytes, encrypted, created_at]
      properties:
        id:
          type: string
          format: uuid
          description: Pass it to `run` as `flowUploadId`.
        sha:
          type: string
          description: The zip's SHA-256, lowercase hex.
        bytes:
          type: integer
        encrypted:
          type: boolean
          description: The zip was encrypted on the client.
        created_at:
          type: string
          format: date-time

    BundleResponse:
      type: object
      required: [bundle]
      properties:
        bundle:
          $ref: '#/components/schemas/FlowBundle'

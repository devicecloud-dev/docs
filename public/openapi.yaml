  /device/sessions/{id}/install:
    parameters:
      - name: id
        in: path
        required: true
        description: The session id, such as `brave-teal-otter`. The numeric `live_id` works too.
        schema:
          type: string
        example: brave-teal-otter
    post:
      tags: [Device control]
      operationId: installApp
      summary: Install a build
      description: >-
        Installs an uploaded build (`binaryUploadId`), or a build downloaded from an https URL (`url`, up to
        500 MB). Android takes an `.apk`; iOS takes a zipped simulator `.app`, not an `.ipa`. The request
        returns once the build is checked; the device installs it in the background. Watch `session.install`
        until its `status` is `installed`. A command sent meanwhile waits up to 45 s for the install, then
        answers `LIVE_NOT_READY`.
      parameters:
        - name: x-dcd-source
          in: header
          required: false
          description: >-
            Which interface sent the request: `cli`, `mcp`, `web` or `api`, in any case. It is recorded as the
            command's `source` on the timeline. Any other value, or none, counts as `api`. It is a label, not a
            credential.
          schema:
            type: string
            enum: [cli, mcp, web, api]
            default: api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InstallRequest'
            examples:
              upload:
                summary: An uploaded build
                value:
                  binaryUploadId: 3f1c9a52-7d4e-4b8a-9c21-6e0f5a2b7d13
              url:
                summary: A build at a URL
                value:
                  url: https://ci.example.com/artifacts/app-release.apk
      responses:
        '201':
          description: The build is on its way to the device.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InstallResponse'
              example:
                app:
                  binary_upload_id: 8a2d4c6e-1f3b-4d5a-8e7c-9b0a1c2d3e4f
                  app_id: com.example.app
                  reused: false
                session:
                  id: brave-teal-otter
                  live_id: 4182
                  state: active
                  release_reason: null
                  platform: android
                  model: pixel-10-api-36
                  client_label: claude-code
                  created_at: '2026-11-10T14:00:00.000Z'
                  started_at: '2026-11-10T14:00:21.000Z'
                  released_at: null
                  expires_at: '2026-11-10T15:00:21.000Z'
                  queue: null
                  time_remaining_s: 2981
                  idle_remaining_s: 300
                  cost_so_far_usd: 0.33
                  last_crash: null
                  install:
                    binary_upload_id: 8a2d4c6e-1f3b-4d5a-8e7c-9b0a1c2d3e4f
                    status: installing
                    error: null
                  warnings:
                    - 'The app is still installing. The session says "ready" because the device is up, but commands wait for the install (up to 45s) and then answer LIVE_NOT_READY. Over MCP, get_device_status with wait: true waits for it.'
                  monitor_url: https://console.devicecloud.dev/device/brave-teal-otter
        '400':
          description: >-
            `LIVE_INVALID_APP`: neither or both of `binaryUploadId` and `url` were given, or the build isn't
            your organization's, is for the other platform, or isn't an app this device can install.
            `LIVE_APP_DOWNLOAD_FAILED`: the build at `url` couldn't be downloaded (not https, not a public host,
            an error status, too large, or too slow).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LiveError'
              examples:
                invalidApp:
                  summary: A build for the other platform
                  value:
                    statusCode: 400
                    message: Binary platform (ios) does not match session platform (android)
                    error: LIVE_INVALID_APP
                downloadFailed:
                  summary: The URL couldn't be downloaded
                  value:
                    statusCode: 400
                    message: 'Downloading the app failed: the server answered 404.'
                    error: LIVE_APP_DOWNLOAD_FAILED
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/LiveNotFound'
        '409':
          description: >-

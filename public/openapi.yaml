# DeviceCloud REST API: OpenAPI 3.1 description of the endpoints in the
# docs' REST API section, served at https://docs.devicecloud.dev/openapi.yaml.
# Written by hand from dcd/api (the code wins over the pages) and checked
# against real responses. Change it with any page under api/. Lint:
#   npx @redocly/cli@2.71.2 lint public/openapi.yaml
openapi: 3.1.0
info:
  title: DeviceCloud REST API
  version: 1.0.0
  summary: Test results, run status, flow analytics and device sessions for DeviceCloud.
  description: |
    The DeviceCloud REST API gives you programmatic access to the same data as the
    console: test runs and their results, reports and artifacts, flow analytics,
    and device sessions for AI agents.

    To start test runs, use the [`dcd` CLI](https://docs.devicecloud.dev/cli-reference/cloud)
    or one of the CI integrations. This API reads their results.

    ## Authentication

    Send an API key in the `x-app-api-key` header. Create keys in the console under
    **Settings → API Keys**. A missing or invalid key answers `403`.

    A DeviceCloud login session also works, which is how the CLI authenticates after
    `dcd login`: send `Authorization: Bearer <access-token>` together with
    `x-dcd-org: <team-id>`. For scripts and CI, use an API key.

    A key limited to **Device sessions only** reaches the `/device/*` endpoints and
    nothing else in this API. Other endpoints answer it with `403` and
    `"error": "API_KEY_SCOPE"`.

    ## Rate limits

    The API accepts up to 60 requests a minute. Over the limit it answers `429`
    with a `Retry-After` header. These endpoints aren't rate limited, so they're
    safe to poll: `GET /results/{uploadId}`, `GET /uploads/status` and
    `GET /ip-addresses`. The device session endpoints have their own limits,
    described on each one.

    ## Errors

    Errors are JSON. Most have the shape of `ErrorEnvelope`: the HTTP status in
    `statusCode`, a human-readable `message`, and sometimes a machine-readable
    `error` code. Match on `error` codes, never on `message` text.

    `GET /results/{uploadId}`, `GET /flows` and `GET /flows/runs` are the exception.
    They answer HTTP `200` and report a client error in the body as
    `{ "statusCode": 400, "message": "..." }`, so check `statusCode` in the body
    as well as the HTTP status.

    ## Compatibility

    Fields may be added to any response at any time. Ignore fields you don't know.
    Existing fields aren't renamed, removed or re-typed.
  termsOfService: https://docs.devicecloud.dev/legal/terms-and-conditions
  contact:
    name: DeviceCloud support
    email: support@devicecloud.dev
    url: https://docs.devicecloud.dev
externalDocs:
  description: REST API guide
  url: https://docs.devicecloud.dev/rest-api/overview
servers:
  - url: https://api.devicecloud.dev
security:
  - apiKey: []
  - bearerAuth: []
    orgHeader: []
tags:
  - name: Uploads
    description: |
      An upload is one test run: the flows and app binary sent by `dcd cloud`, and
      the tests they produced. List uploads and poll a run's status.
    externalDocs:
      url: https://docs.devicecloud.dev/rest-api/uploads
  - name: Results
    description: |
      One upload's test results, its JUnit and HTML reports, and its artifacts
      (logs, screenshots and videos).
    externalDocs:
      url: https://docs.devicecloud.dev/rest-api/results
  - name: Flows
    description: |
      Analytics across every run of each flow file: pass rates, run counts,
      durations and run history. Pass rates are `passed / (passed + failed)`,
      leaving out cancelled and unfinished runs.
    externalDocs:
      url: https://docs.devicecloud.dev/rest-api/flows
  - name: Device sessions
    description: >-
      Start, list, read and stop device sessions (cloud iOS simulators and Android emulators), and list the
      devices you can start. A session is named by its id, such as `brave-teal-otter`, in every path.
  - name: Device control
    description: >-
      Drive a session's device: install and launch apps, send one action, run Maestro flows, and read the
      screen and the app's device logs.
  - name: Flow bundles
    description: >-
      Upload a zip of Maestro flows, then run it with `run` as `flowUploadId`. A bundle can be up to 50 MB.
  - name: Human handoff
    description: >-
      Ask a person to do something on the device that an agent can't, such as entering a 2FA code, and find
      out when they hand the session back.
  - name: Session artifacts
    description: >-
      What a session leaves behind: the timeline of its commands, its video, its device log, and the screen
      after each action.
  - name: IP addresses
    description: |
      The test runners' egress IP addresses, for firewall allow-lists. No API key
      needed.
    externalDocs:
      url: https://docs.devicecloud.dev/rest-api/ip-addresses
paths:
  /uploads/list:
    get:
      operationId: listUploads
      tags: [Uploads]
      summary: List uploads
      description: |
        Your organization's uploads, newest first.
      parameters:
        - name: name
          in: query
          description: |
            Only uploads with this name. `*` is a wildcard, and a name with a
            wildcard matches without regard to case. Without one, the match is exact.
          schema:
            type: string
          example: Nightly*
        - name: from
          in: query
          description: |
            Only uploads created at or after this time. ISO 8601: a date
            (`2026-01-01`) or a date and time (`2026-01-01T00:00:00Z`).
          schema:
            type: string
          example: '2026-01-01'
        - name: to
          in: query
          description: |
            Only uploads created at or before this time. A date without a time
            means midnight at the start of that day (UTC), so `to=2026-01-31`
            leaves out uploads made on 31 January. Use `2026-02-01` or
            `2026-01-31T23:59:59Z` to include them.
          schema:
            type: string
          example: '2026-02-01'
        - name: limit
          in: query
          description: How many uploads to return. At most 1,000 come back per request.
          schema:
            type: integer
            minimum: 1
            default: 20
        - name: offset
          in: query
          description: How many uploads to skip, for paging.
          schema:
            type: integer
            minimum: 0
            default: 0
      responses:
        '200':
          description: A page of uploads.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadList'
        '400':
          description: '`from` or `to` isn''t ISO 8601, `from` is after `to`, or `limit` or `offset` isn''t a valid number.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                statusCode: 400
                message: '"from" date must be before or equal to "to" date'
                error: '"from" date must be before or equal to "to" date'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/KeyCheckUnavailable'
  /uploads/status:
    get:
      operationId: getUploadStatus
      tags: [Uploads]
      summary: Get upload status
      description: |
        The overall status of a run and the latest attempt of each of its tests.
        Made for polling: this endpoint isn't rate limited.

        The overall `status` is worked out from the tests:

        - `FAILED` as soon as any test has failed or been cancelled, even while
          others still run. Check `tests` if you need every test to finish.
        - Otherwise `RUNNING`, `PENDING` or `QUEUED` while tests are in progress.
        - `PASSED` when every test has passed.

        Pass `uploadId` or `name`. With both, `uploadId` is tried first.
      parameters:
        - name: uploadId
          in: query
          description: The upload's ID.
          schema:
            type: string
            format: uuid
        - name: name
          in: query
          description: The upload's name. When several uploads share it, the most recent one.
          schema:
            type: string
      responses:
        '200':
          description: The run's status.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UploadStatus'
        '400':
          description: Neither `uploadId` nor `name` was given, or `uploadId` isn't a UUID.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              examples:
                missing:
                  summary: Neither parameter
                  value:
                    statusCode: 400
                    message: Either uploadId or name must be provided
                    error: Either uploadId or name must be provided
                notUuid:
                  summary: Malformed upload ID
                  value:
                    statusCode: 400
                    message: Validation failed (uuid is expected)
                    error: Bad Request
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: No upload in your organization matches.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                statusCode: 404
                message: Upload not found
                error: Upload not found
        '503':
          $ref: '#/components/responses/KeyCheckUnavailable'
  /results/{uploadId}:
    get:
      operationId: getResults
      tags: [Results]
      summary: Get results
      description: |
        Every test result for an upload, including each retry as its own entry.
        Made for polling: this endpoint isn't rate limited.

        The full view includes each test's run settings (`config`) and stored files
        (`result_files`, with the step log inlined when it is 512 KB or smaller), so
        large uploads can run to several megabytes. To follow a run's progress, use
        `view=summary`, or `GET /uploads/status` if you only need the latest
        attempt of each test.

        Responses carry an `ETag`. Send it back in `If-None-Match`, with
        `Cache-Control: max-age=0`, and the API answers `304` with no body when
        nothing has changed. (Fetch-based clients add `Cache-Control: no-cache`
        to a request with `If-None-Match`, and the API then always sends the full
        response.)

        An upload ID with no results in your organization answers an empty
        `results` list, not `404`.
      parameters:
        - $ref: '#/components/parameters/UploadId'
        - name: view
          in: query
          description: |
            `summary` returns only the fields needed to follow a run's progress:
            `id`, `test_file_name`, `status`, `fail_reason`, `duration_seconds`,
            `retry_of`, `cancellation_reason`, `simulator_name`, and a `config`
            holding only `deviceName` and `osVersion`. Any other value, or none,
            returns the full view.
          schema:
            type: string
            enum: [summary]
        - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: |
            The results, or an error reported in the body (`statusCode: 400`).
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ResultsResponse'
                  - $ref: '#/components/schemas/InBodyError'
              examples:
                summary:
                  summary: view=summary
                  value:
                    statusCode: 200
                    results:
                      - id: 4500
                        test_file_name: ./login-test/onboarding.yaml
                        status: FAILED
                        retry_of: null
                        duration_seconds: 32
                        fail_reason: 'Element not found: Text matching regex next.* not found'
                        cancellation_reason: null
                        simulator_name: pixel-7-api-34
                        config:
                          deviceName: Pixel 7
                          osVersion: '34'
                full:
                  summary: Full view (config and result_files shortened)
                  value:
                    statusCode: 200
                    results:
                      - id: 4500
                        test_file_name: ./login-test/onboarding.yaml
                        test_name: Onboarding
                        status: FAILED
                        retry_of: null
                        created_at: '2026-01-15T10:30:04.512+00:00'
                        duration_seconds: 32
                        fail_reason: 'Element not found: Text matching regex next.* not found'
                        cancellation_reason: null
                        simulator_name: pixel-7-api-34
                        platform: android
                        config:
                          deviceName: Pixel 7
                          osVersion: '34'
                          maestroVersion: 2.10.0
                        result_files:
                          id: 9120
                          result_id: 4500
                          main_log: '...'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/InvalidUploadId'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          $ref: '#/components/responses/KeyCheckUnavailable'
  /results/{uploadId}/report:
    get:
      operationId: getJunitReport
      tags: [Results]
      summary: Download JUnit report
      description: |
        One JUnit XML report covering the latest attempt of every test in the
        upload. A test without a report of its own gets a generated test case, so
        every test appears.
      parameters:
        - $ref: '#/components/parameters/UploadId'
      responses:
        '200':
          description: The JUnit XML report.
          headers:
            Content-Disposition:
              description: '`attachment; filename="report-<uploadId>.xml"`'
              schema:
                type: string
          content:
            application/xml:
              schema:
                type: string
              example: |
                <?xml version="1.0" encoding="UTF-8"?>
                <testsuites tests="1" failures="0" time="11">
                  <testsuite name="Test Suite" device="pixel-7-api-34" tests="1" failures="0" time="11">
                    <testcase id="Onboarding" name="Onboarding" classname="Onboarding" time="11"/>
                  </testsuite>
                </testsuites>
        '400':
          $ref: '#/components/responses/InvalidUploadId'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoResults'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/MessageOnlyServerError'
        '503':
          $ref: '#/components/responses/KeyCheckUnavailable'
  /results/{uploadId}/html-report:
    get:
      operationId: getHtmlReport
      tags: [Results]
      summary: Download HTML report
      description: |
        A ZIP holding the HTML report (`report.html`) with the screenshots, videos
        and logs of the latest attempt of every test in the upload.
      parameters:
        - $ref: '#/components/parameters/UploadId'
      responses:
        '200':
          description: The report as a ZIP, streamed as it is built.
          headers:
            Content-Disposition:
              description: '`attachment; filename="report-<uploadId>.zip"`'
              schema:
                type: string
          content:
            application/zip:
              schema:
                type: string
                contentMediaType: application/zip
        '400':
          $ref: '#/components/responses/InvalidUploadId'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NoResults'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/MessageOnlyServerError'
        '503':
          $ref: '#/components/responses/KeyCheckUnavailable'
  /results/{uploadId}/download:
    post:
      operationId: downloadArtifacts
      tags: [Results]
      summary: Download artifacts
      description: |
        A ZIP of the upload's logs, screenshots and videos. Each test's files sit in
        a folder named after its result ID (`<resultId>/logs/`,
        `<resultId>/screenshots/`, `<resultId>/videos/`), and a JUnit `report.xml`
        for the whole upload is at the root. Every attempt's files are included,
        so a retried test's failed attempt can still be debugged.

        The ZIP is streamed as it is built. An error after streaming starts ends
        the download early, leaving a truncated ZIP.
      parameters:
        - $ref: '#/components/parameters/UploadId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DownloadArtifactsRequest'
            example:
              results: FAILED
      responses:
        '201':
          description: The artifacts as a ZIP. (The status is `201`, not `200`.)
          headers:
            Content-Disposition:
              description: '`attachment; filename="artifacts.zip"`'
              schema:
                type: string
          content:
            application/zip:
              schema:
                type: string
                contentMediaType: application/zip
        '400':
          description: |
            `uploadId` isn't a UUID (JSON), or the ZIP couldn't be assembled (the
            message as plain text).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                statusCode: 400
                message: Validation failed (uuid is expected)
                error: Bad Request
            text/plain:
              schema:
                type: string
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          description: |
            The upload has no results in your organization, or doesn't exist. Unlike
            the report downloads, this one answers with the standard error envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorEnvelope'
              example:
                statusCode: 404
                message: No results found for this upload
                error: Not Found
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/KeyCheckUnavailable'
  /flows:
    get:
      operationId: getFlowSummaries
      tags: [Flows]
      summary: Get flow summaries
      description: |
        Pass rates, run counts, average durations and a daily status breakdown for
        every flow in your organization: the data on the console's Flows page.
      parameters:
        - $ref: '#/components/parameters/PlatformFilter'
        - $ref: '#/components/parameters/AppIdFilter'
        - name: days
          in: query
          description: How many days to look back. Ignored when `startDate` is set.
          schema:
            type: integer
            minimum: 1
            default: 14
        - name: startDate
          in: query
          description: |
            Start of the range, ISO 8601. Overrides `days`. A date without a time
            means the start of that day (UTC).
          schema:
            type: string
          example: '2026-01-01'
        - name: endDate
          in: query
          description: |
            End of the range, ISO 8601. A date without a time means the end of that
            day (UTC). Defaults to now when `startDate` is set.
          schema:
            type: string
          example: '2026-01-31'
        - name: tags
          in: query
          description: Comma-separated tags. Returns flows that have any of them.
          schema:
            type: string
          example: smoke,critical
      responses:
        '200':
          description: |
            The flow summaries, or an error reported in the body (`statusCode: 400`),
            for example for a date that can't be read.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/FlowSummaries'
                  - $ref: '#/components/schemas/InBodyError'
              examples:
                flows:
                  summary: Flow summaries
                  value:
                    statusCode: 200
                    flows:
                      - flow_name: Login flow
                        file_name: ./auth/login.yaml
                        pass_rate: 94
                        passed_runs: 47
                        failed_runs: 3
                        total_runs: 50
                        avg_duration: 38
                        last_run_at: '2026-01-31T14:22:00+00:00'
                        tags: [smoke, critical]
                        daily_data:
                          '2026-01-31': passed
                          '2026-01-30': mixed
                          '2026-01-29': null
                error:
                  summary: Error in the body
                  value:
                    statusCode: 400
                    message: Invalid time value
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/KeyCheckUnavailable'
  /flows/runs:
    get:
      operationId: getFlowRuns
      tags: [Flows]
      summary: Get runs for a flow
      description: Every run of one flow file, newest first.
      parameters:
        - name: fileName
          in: query
          required: true
          description: |
            The flow's path exactly as `GET /flows` returns it in `file_name`:
            relative to the flows folder that was run, starting with `./`.
          schema:
            type: string
          example: ./auth/login.yaml
        - $ref: '#/components/parameters/PlatformFilter'
        - $ref: '#/components/parameters/AppIdFilter'
        - name: limit
          in: query
          description: How many runs to return.
          schema:
            type: integer
            minimum: 1
            default: 100
        - name: startDate
          in: query
          description: Start of the range, ISO 8601. A date without a time means the start of that day (UTC).
          schema:
            type: string
        - name: endDate
          in: query
          description: End of the range, ISO 8601. A date without a time means the end of that day (UTC).
          schema:
            type: string
      responses:
        '200':
          description: |
            The runs, or an error reported in the body (`statusCode: 400`), for
            example when `fileName` is missing.
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/FlowRuns'
                  - $ref: '#/components/schemas/InBodyError'
              examples:
                runs:
                  summary: Runs
                  value:
                    statusCode: 200
                    runs:
                      - id: 4500
                        status: PASSED
                        createdAt: '2026-01-31T14:22:00+00:00'
                        durationSeconds: 35
                        failReason: null
                        testUploadId: 7e12345f-eb12-12ec-a30b-bb1234f1d12a
                        uploadName: Nightly regression
                missing:
                  summary: Missing fileName
                  value:
                    statusCode: 400
                    message: fileName query parameter is required.
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'
        '500':
          $ref: '#/components/responses/ServerError'
        '503':
          $ref: '#/components/responses/KeyCheckUnavailable'
  /device/models:
    get:
      tags: [Device sessions]
      operationId: listDeviceModels
      summary: List the devices you can start
      description: >-
        The iOS simulators and Android emulators a session can ask for, with their OS versions and defaults.
        `model`, `os` and `googlePlay` on POST /device/sessions take these values. The list follows the fleet,
        so a device or OS version the fleet drops disappears here too.
      responses:
        '200':
          description: The devices, by platform.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceCatalogue'
              example:
                ios:
                  - model: iphone-16
                    name: iPhone 16
                    os: ['18', '26', '27']
                    default_os: '26'
                    google_play: false
                    default: true
                  - model: iphone-17
                    name: iPhone 17
                    os: ['26', '27']
                    default_os: '26'
                    google_play: false
                    default: false
                  - model: ipad-pro-m5-11
                    name: iPad Pro 11-inch (M5)
                    os: ['26']
                    default_os: '26'
                    google_play: false
                    default: false
                android:
                  - model: pixel-10
                    name: Pixel 10
                    os: ['36', '37']
                    default_os: '36'
                    google_play: false
                    default: true
                  - model: pixel-8
                    name: Pixel 8
                    os: ['34', '35', '36']
                    default_os: '36'
                    google_play: false
                    default: false
                  - model: pixel-6
                    name: Pixel 6
                    os: ['32', '35']
                    default_os: '35'
                    google_play: false
                    default: false
                  - model: pixel-10
                    name: Pixel 10
                    os: ['36']
                    default_os: '36'
                    google_play: true
                    default: false
                  - model: pixel-8
                    name: Pixel 8
                    os: ['34']
                    default_os: '34'
                    google_play: true
                    default: false
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/LiveRateLimited'

  /device/sessions:
    post:
      tags: [Device sessions]
      operationId: startDeviceSession
      summary: Start a device session
      description: >-
        Asks for a device. A new session is `queued` until a device is free, then moves through `provisioning`
        to `ready` on its own: poll GET /device/sessions/{id} until it is `ready`. Billing starts when a device
        is assigned. The session ends after 5 idle minutes, at its maximum duration, or when you stop it.
        This endpoint has no per-minute rate limit, but your organization can only have so many sessions
        open at once.
      parameters:
        - name: x-dcd-source
          in: header
          required: false
          description: >-
            Which interface sent the request: `cli`, `mcp`, `web` or `api`, in any case. Here it is recorded
            only on the timeline entry for the build named in `binaryUploadId`. Any other value, or none,
            counts as `api`. It is a label, not a credential.
          schema:
            type: string
            enum: [cli, mcp, web, api]
            default: api
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StartSessionRequest'
            example:
              platform: android
              model: pixel-10
              os: '36'
              binaryUploadId: 3f1c9a52-7d4e-4b8a-9c21-6e0f5a2b7d13
              clientLabel: claude-code
              maxDurationMin: 30
      responses:
        '201':
          description: The session was created. It is usually still `queued`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SessionResponse'
              example:
                session:
                  id: brave-teal-otter
                  live_id: 4182
                  state: queued
                  release_reason: null
                  platform: android
                  model: pixel-10-api-36

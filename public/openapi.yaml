  /device/sessions/{id}/logs:
    parameters:
      - name: id
        in: path
        required: true
        description: The session id, such as `brave-teal-otter`. The numeric `live_id` works too.
        schema:
          type: string
        example: brave-teal-otter
    get:
      tags: [Device control]
      operationId: getDeviceLogs
      summary: Read the app's device logs
      description: >-
        The installed app's recent device log lines: its logcat lines on Android, its unified log on iOS.
        `level` and `grep` narrow them; with either, the newest 2000 lines are searched and the newest `lines`
        matches come back. The answer stops at 24 KB, keeping the newest lines, with `truncated: true` when
        older ones were left out. Read from the device on request, so it waits up to 45 s for a device that is
        still starting.
      parameters:
        - name: x-dcd-source
          in: header
          required: false
          description: >-
            Which interface sent the request: `cli`, `mcp`, `web` or `api`, in any case. It is recorded as the
            command's `source` on the timeline. Any other value, or none, counts as `api`. It is a label, not a
            credential.
          schema:
            type: string
            enum: [cli, mcp, web, api]
            default: api
        - name: lines
          in: query
          required: false
          description: How many lines to return. Values out of range are clamped; a value that isn't a number reads as 200.
          schema:
            type: integer
            minimum: 1
            maximum: 2000
            default: 200
        - name: level
          in: query

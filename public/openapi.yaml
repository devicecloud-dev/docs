                      install:
                        binary_upload_id: 8a2d4c6e-1f3b-4d5a-8e7c-9b0a1c2d3e4f
                        status: installed
                        error: null
                      warnings: []
                      monitor_url: https://console.devicecloud.dev/device/brave-teal-otter
        '429':
          description: >-
            `LIVE_RATE_LIMITED`: over the per-session command limit (60 a minute; the body has `limit` and
            `retry_after_s`), or too many installs from a URL are running on the API at once (no
            `retry_after_s`; retry in a minute). No `Retry-After` header is sent.
          content:
            application/json:
